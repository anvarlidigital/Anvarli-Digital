<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Fine Weave Texture Pattern -->
    <radialGradient id="royalBgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#182030" />
      <stop offset="45%" stop-color="#0E1422" />
      <stop offset="85%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>

    <!-- Linen Texture Filter -->
    <pattern id="linenTexture" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none" />
      <path d="M 0 2 L 4 2 M 2 0 L 2 4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04" />
    </pattern>

    <!-- Embossed 3D Metallic Gold Gradients -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E0" />
      <stop offset="15%" stop-color="#FCE59F" />
      <stop offset="35%" stop-color="#DDB34B" />
      <stop offset="55%" stop-color="#B28222" />
      <stop offset="80%" stop-color="#E2BE60" />
      <stop offset="100%" stop-color="#8E6310" />
    </linearGradient>

    <linearGradient id="goldBevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="30%" stop-color="#ECC669" />
      <stop offset="70%" stop-color="#A57416" />
      <stop offset="100%" stop-color="#644304" />
    </linearGradient>

    <linearGradient id="goldShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#936814" />
    </linearGradient>

    <!-- Deep 3D Emboss Drop Shadows -->
    <filter id="royal3dShadow" x="-25%" y="-25%" width="150%" height="150%">
      <!-- Deep dark shadow behind -->
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
      <!-- Top-left subtle gold specular ambient bounce -->
      <feDropShadow dx="-1" dy="-2" stdDeviation="2" flood-color="#FFF2BA" flood-opacity="0.25" />
    </filter>

    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxurious Navy Canvas -->
  <rect width="800" height="800" fill="url(#royalBgGlow)" />
  <rect width="800" height="800" fill="url(#linenTexture)" />

  <!-- Center Ambient Gold Flare -->
  <circle cx="400" cy="320" r="280" fill="#D4AF37" opacity="0.06" filter="url(#monogramGlow)" />

  <!-- MAIN EMBOSSED GROUP -->
  <g filter="url(#royal3dShadow)">
    
    <!-- ========================================== -->
    <!-- INTERTWINED CALLIGRAPHIC "TT" MONOGRAM     -->
    <!-- Matching the uploaded logo curves & loops   -->
    <!-- ========================================== -->

    <!-- Ambient Shadow Under-Stroke for 3D Depth -->
    <g opacity="0.4" transform="translate(4, 6)">
      <!-- First T Stem & Top Swash Underlay -->
      <path d="M 280 190 
               C 330 150, 440 145, 500 175
               C 525 188, 530 208, 515 220
               C 495 235, 465 222, 450 210
               C 405 190, 345 192, 315 210
               C 300 218, 295 230, 305 245
               C 330 290, 375 365, 360 440
               C 345 510, 295 550, 240 535
               C 195 520, 185 475, 210 445
               C 230 415, 275 430, 275 460
               C 275 480, 255 490, 240 485
               C 230 482, 228 475, 230 468
               C 235 455, 260 458, 265 478
               C 268 492, 285 505, 310 490
               C 340 468, 355 395, 325 320
               C 310 282, 288 245, 265 215
               C 250 198, 262 190, 280 190 Z" 
            fill="#05080E" />

      <!-- Second T Stem & Swash Underlay -->
      <path d="M 370 210 
               C 415 165, 540 160, 605 195 
               C 628 208, 630 226, 612 240
               C 590 255, 560 240, 545 225
               C 500 200, 430 205, 400 228
               C 385 240, 385 255, 395 272
               C 430 330, 475 405, 445 485
               C 425 538, 372 568, 325 552
               C 285 538, 278 500, 302 470
               C 325 440, 370 448, 370 480
               C 370 502, 348 510, 332 505
               C 328 502, 325 495, 328 490
               C 335 478, 358 480, 362 495
               C 368 510, 388 522, 408 508
               C 438 482, 442 410, 410 335
               C 390 292, 362 252, 348 230
               C 338 215, 350 210, 370 210 Z" 
            fill="#05080E" />
    </g>

    <!-- First Calligraphic "T" Primary Gold Shape -->
    <path d="M 280 190 
             C 330 150, 440 145, 500 175
             C 525 188, 530 208, 515 220
             C 495 235, 465 222, 450 210
             C 405 190, 345 192, 315 210
             C 300 218, 295 230, 305 245
             C 330 290, 375 365, 360 440
             C 345 510, 295 550, 240 535
             C 195 520, 185 475, 210 445
             C 230 415, 275 430, 275 460
             C 275 480, 255 490, 240 485
             C 230 482, 228 475, 230 468
             C 235 455, 260 458, 265 478
             C 268 492, 285 505, 310 490
             C 340 468, 355 395, 325 320
             C 310 282, 288 245, 265 215
             C 250 198, 262 190, 280 190 Z" 
          fill="url(#goldHighlight)" 
          stroke="url(#goldBevelLight)" 
          stroke-width="1.8" />

    <!-- Second Intertwined "T" Primary Gold Shape -->
    <path d="M 370 210 
             C 415 165, 540 160, 605 195 
             C 628 208, 630 226, 612 240
             C 590 255, 560 240, 545 225
             C 500 200, 430 205, 400 228
             C 385 240, 385 255, 395 272
             C 430 330, 475 405, 445 485
             C 425 538, 372 568, 325 552
             C 285 538, 278 500, 302 470
             C 325 440, 370 448, 370 480
             C 370 502, 348 510, 332 505
             C 328 502, 325 495, 328 490
             C 335 478, 358 480, 362 495
             C 368 510, 388 522, 408 508
             C 438 482, 442 410, 410 335
             C 390 292, 362 252, 348 230
             C 338 215, 350 210, 370 210 Z" 
          fill="url(#goldShine)" 
          stroke="url(#goldHighlight)" 
          stroke-width="1.8" />

    <!-- Center Interlacing Loop Ribbon -->
    <path d="M 305 375 C 365 325, 425 340, 470 395 C 490 420, 478 445, 445 440 C 405 432, 370 388, 305 375 Z" 
          fill="url(#goldHighlight)" opacity="0.95" />

    <!-- ========================================== -->
    <!-- BRAND NAME: TRIM & TWISTED                  -->
    <!-- Matching original serif typography exactly  -->
    <!-- ========================================== -->

    <!-- TRIM -->
    <text x="400" y="605" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="20" 
          text-anchor="middle" 
          fill="url(#goldHighlight)"
          stroke="#4A3405"
          stroke-width="0.8">TRIM</text>

    <!-- Flourish & Ampersand Line -->
    <!-- Left Curled Swash -->
    <path d="M 285 640 C 305 632, 330 650, 355 640" 
          fill="none" 
          stroke="url(#goldHighlight)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- Ampersand & in center -->
    <text x="400" y="650" 
          font-family="'Playfair Display', 'Cinzel', serif" 
          font-size="40" 
          font-style="italic"
          font-weight="700" 
          text-anchor="middle" 
          fill="url(#goldHighlight)">&amp;</text>

    <!-- Right Curled Swash -->
    <path d="M 445 640 C 470 650, 495 632, 515 640" 
          fill="none" 
          stroke="url(#goldHighlight)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- TWISTED with custom curved T and D sweep -->
    <text x="400" y="715" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="58" 
          font-weight="900" 
          letter-spacing="14" 
          text-anchor="middle" 
          fill="url(#goldHighlight)"
          stroke="#4A3405"
          stroke-width="0.8">TWISTED</text>

    <!-- Tagline: Beauty Is You -->
    <text x="400" y="762" 
          font-family="'Playfair Display', Georgia, serif" 
          font-style="italic"
          font-size="28" 
          font-weight="600" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="#FFF0A5"
          opacity="0.95">&mdash; Beauty Is You &mdash;</text>
  </g>
</svg>
